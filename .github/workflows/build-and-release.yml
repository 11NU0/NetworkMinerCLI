name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-net48
            os: windows-latest
            build_cmd: dotnet build NetworkMinerCLI.sln -c Release -f net48 --no-restore
            artifact_path: NetworkMinerCLI/bin/Release/net48
          - name: win-net8
            os: windows-latest
            build_cmd: dotnet build NetworkMinerCLI.sln -c Release -f net8.0 --no-restore
            artifact_path: NetworkMinerCLI/bin/Release/net8.0
          - name: linux-net8
            os: ubuntu-latest
            build_cmd: dotnet publish NetworkMinerCLI/NetworkMinerCLI.csproj -c Release -f net8.0 -r linux-x64 --self-contained --no-restore
            artifact_path: NetworkMinerCLI/bin/Release/net8.0/linux-x64/publish
          - name: osx-net8
            os: macos-latest
            build_cmd: dotnet publish NetworkMinerCLI/NetworkMinerCLI.csproj -c Release -f net8.0 -r osx-x64 --self-contained --no-restore
            artifact_path: NetworkMinerCLI/bin/Release/net8.0/osx-x64/publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NetworkMinerCLI.sln

      - name: Build or publish
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
